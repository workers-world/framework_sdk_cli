# master 上用户可见变更合入后自动 patch+1 package.json，再触发 ci-publish 发新 Packages 版。
# 对齐 worker-actions release-actions-bundle：paths 门控 + commit subject [skip version-bump] 防循环。
# 见 README「自动 semver」；ww#47 / PGREQ20261017000024
name: Auto version bump

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tsup.config.ts"
      - "package.json"
  workflow_dispatch:
    inputs:
      version:
        description: 可选。留空则 patch+1；填写如 0.3.0 则使用该版本
        required: false
        type: string
        default: ""
      bump_level:
        description: workflow_dispatch 未填 version 时的 bump 级别
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions: {}

concurrency:
  group: auto-version-bump-framework-sdk-cli
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Skip gate ([skip version-bump])
        id: check
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          subject="${MSG%%$'\n'*}"
          if [[ "$subject" == *'[skip version-bump]'* ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skip bump: commit subject contains [skip version-bump]"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  bump:
    runs-on: ubuntu-latest
    needs: gate
    if: >
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.gate.result == 'success' && needs.gate.outputs.proceed == 'true')
      )
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKERS_WORLD_GHA_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@workers-world"

      - name: Resolve and apply semver bump
        id: bump
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LEVEL: ${{ inputs.bump_level }}
        run: |
          set -euo pipefail
          args=(node .github/scripts/run-auto-version-bump.mjs --write)
          if [ -n "${INPUT_VERSION}" ]; then
            args+=(--explicit="${INPUT_VERSION}")
          else
            args+=(--level="${INPUT_LEVEL:-patch}")
          fi
          result="$("${args[@]}")"
          echo "$result"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          next="$(node -p "JSON.parse(process.argv[1]).next" "$result")"
          if [ -z "$next" ] || [ "$next" = "null" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "No bump needed"
            exit 0
          fi
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"

      - name: Commit and push bump
        if: steps.bump.outputs.bumped == 'true'
        env:
          PUSH_TOKEN: ${{ secrets.WORKERS_WORLD_GHA_TOKEN || secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release framework_sdk_cli v${NEXT} [skip version-bump]"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:master"
