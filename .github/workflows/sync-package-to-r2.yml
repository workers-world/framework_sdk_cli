# Packages published → 拉 tarball 写入 R2（独立于 ci-publish）。
name: Sync published package to R2

on:
  registry_package:
    types: [published]
  workflow_dispatch:
    inputs:
      package_name:
        description: npm package name
        required: true
        default: '@workers-world/framework_sdk_cli'
      package_version:
        description: semver to sync
        required: true

permissions:
  contents: read
  packages: read

jobs:
  sync-to-r2:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.registry_package.name == '@workers-world/framework_sdk_cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@workers-world"

      - name: Resolve package coordinates
        id: coords
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.package_name }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.package_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.registry_package.name }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.registry_package.version }}" >> "$GITHUB_OUTPUT"
          fi

      # npx 只把包放进 npx cache，ESM import 从脚本目录向上找不到它。
      # 装到脚本旁的 node_modules，bare specifier 才能解析（与 ww 仓同修法）。
      - name: Install R2 client
        run: |
          set -euo pipefail
          npm install --prefix .github/scripts --no-save --no-package-lock @aws-sdk/client-s3@3.758.0

      - name: Sync tarball to R2
        env:
          PACKAGE_NAME: ${{ steps.coords.outputs.name }}
          PACKAGE_VERSION: ${{ steps.coords.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.WW_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.WW_ARTIFACTS_R2_BUCKET }}
          R2_KEY_PREFIX: ${{ vars.WW_ARTIFACTS_R2_KEY_PREFIX }}
        run: |
          set -euo pipefail
          if [ -z "${R2_BUCKET:-}" ]; then
            echo "::error::WW_ARTIFACTS_R2_BUCKET repo variable is not set"
            exit 1
          fi
          node .github/scripts/sync-published-package-to-r2.mjs
